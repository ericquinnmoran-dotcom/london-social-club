<meta name="theme-color" content="#1f5a43">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%231f5a43'/%3E%3Ctext x='20' y='24.5' text-anchor='middle' font-family='Arial,sans-serif' font-size='12' font-weight='700' fill='%23f3f6f2'%3ELSC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: a new club's front page. The Opening Gala is the one live thing (RSVP);
   everything else is a "coming soon" programme of drawn covers, no photos. */
:root {
  --bg: #eceee9;
  --surface: #f7f8f5;
  --surface-2: #e1e5de;
  --fg: #16211b;
  --muted: #59655d;
  --line: #ccd3c9;
  --accent: #1f5a43;
  --accent-ink: #f3f6f2;
  --accent-soft: #d6e4dc;
  --brass: #94692a;
  --ok: #2b7a4c;
  --bad: #a3392d;
  --shadow: 0 1px 2px rgba(22, 33, 27, .06), 0 8px 24px rgba(22, 33, 27, .07);

  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1412;
    --surface: #151d19;
    --surface-2: #1c2621;
    --fg: #e7ebe5;
    --muted: #94a199;
    --line: #29352f;
    --accent: #84c6a6;
    --accent-ink: #0e1412;
    --accent-soft: #1d3329;
    --brass: #d3a95f;
    --ok: #74cf98;
    --bad: #f08a7d;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1412;
  --surface: #151d19;
  --surface-2: #1c2621;
  --fg: #e7ebe5;
  --muted: #94a199;
  --line: #29352f;
  --accent: #84c6a6;
  --accent-ink: #0e1412;
  --accent-soft: #1d3329;
  --brass: #d3a95f;
  --ok: #74cf98;
  --bad: #f08a7d;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  margin: 0;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg);
}
a { color: inherit; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
p { margin: 0; }
.label { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }

.wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- header ---------- */
.site-head {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.2) blur(10px); -webkit-backdrop-filter: saturate(1.2) blur(10px);
  border-bottom: 1px solid var(--line);
}
.site-head .wrap { display: flex; align-items: center; gap: 20px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-right: auto; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand b { font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: -0.01em; white-space: nowrap; }
.brand span { display: block; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); line-height: 1.2; }
.nav { display: flex; gap: 4px; }
.nav a {
  position: relative; white-space: nowrap; text-decoration: none; font-size: 14.5px; padding: 8px 12px; border-radius: var(--r-sm); color: var(--muted);
  transition: color .2s var(--ease), background .2s var(--ease);
}
.nav a:hover { color: var(--fg); background: var(--surface-2); }
.nav a[aria-current="page"] { color: var(--fg); }
.nav a[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 3px; height: 2px; border-radius: 2px; background: var(--accent); }
.nav .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: 2px; }

main { min-height: 60vh; }
.view { animation: viewIn .32s var(--ease) both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: var(--r-sm);
  padding: 11px 18px; font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none;
  transition: transform .18s var(--ease), background .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease), box-shadow .2s var(--ease);
}
.btn svg { width: 16px; height: 16px; transition: transform .2s var(--ease); }
.btn:hover svg.arrow { transform: translateX(3px); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 30%, transparent); transform: translateY(-1px); }
.btn-primary:disabled { opacity: .55; cursor: progress; transform: none; box-shadow: none; }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--fg); }
.btn-ghost:hover { border-color: var(--fg); }
.btn-block { width: 100%; }

/* ---------- home ---------- */
.intro { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 48px; align-items: center; padding-block: 56px 48px; }
.intro h1 { font-size: clamp(28px, 3.2vw, 40px); line-height: 1.12; margin-top: 12px; }
.intro p.lead { margin-top: 16px; font-size: 17.5px; color: var(--muted); max-width: 52ch; }
.intro .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }

.stub {
  position: relative; display: grid; grid-template-columns: 150px minmax(0, 1fr); background: var(--surface); border-radius: var(--r-lg);
  box-shadow: var(--shadow); text-decoration: none; overflow: hidden; transform: rotate(-1.2deg); transition: transform .35s var(--ease);
}
.stub:hover { transform: rotate(0deg) translateY(-3px); }
.stub .art svg { display: block; width: 100%; height: 100%; }
.stub .body { padding: 24px 22px 20px 28px; position: relative; display: grid; gap: 10px; }
.stub .body::before {
  content: ""; position: absolute; left: -9px; top: 0; bottom: 0; width: 18px;
  background: radial-gradient(circle at 9px 9px, var(--bg) 6px, transparent 6.5px) 0 0 / 18px 18px repeat-y;
}
.stub h2 { font-size: 24px; line-height: 1.2; }
.stub .facts-mini { display: grid; gap: 2px; font-size: 14.5px; color: var(--muted); }
.stub .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
.stub .go { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 600; font-size: 14.5px; }
.stub .go svg { width: 16px; height: 16px; transition: transform .2s var(--ease); }
.stub:hover .go svg { transform: translateX(3px); }

.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; font-family: var(--font-body); letter-spacing: 0; text-transform: none; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status.open { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.status.soon { color: var(--brass); background: color-mix(in srgb, var(--brass) 13%, transparent); }

.programme { padding-block: 8px 72px; }
.prog-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.prog-head h2 { font-size: 24px; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; padding-top: 24px; }
.card {
  display: grid; grid-template-rows: auto 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  overflow: hidden; text-decoration: none; transition: transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease);
}
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: transparent; }
.card .art { aspect-ratio: 16 / 9; overflow: hidden; }
.card .art svg { display: block; width: 100%; height: 100%; transition: transform .6s var(--ease); }
.card:hover .art svg { transform: scale(1.05); }
.card .body { padding: 18px 20px 20px; display: grid; gap: 8px; align-content: start; }
.card .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.card h3 { font-size: 19px; line-height: 1.25; }
.card p { font-size: 14.5px; color: var(--muted); }

/* ---------- detail pages ---------- */
.crumbs { padding-block: 22px 0; }
.crumbs a { text-decoration: none; color: var(--muted); font-size: 14px; display: inline-flex; align-items: center; gap: 6px; transition: color .2s var(--ease); }
.crumbs a:hover { color: var(--fg); }
.crumbs svg { width: 15px; height: 15px; transition: transform .2s var(--ease); }
.crumbs a:hover svg { transform: translateX(-2px); }
.detail { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 48px; padding-block: 20px 72px; align-items: start; }
.poster { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow); aspect-ratio: 4 / 5; max-width: 100%; }
.poster svg { display: block; width: 100%; height: 100%; }
.poster .stamp {
  position: absolute; left: 22px; bottom: 20px; right: 22px; display: flex; justify-content: space-between; align-items: end; gap: 12px;
  color: #f1ece1; font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
}
.poster .stamp b { display: block; font-family: var(--font-display); font-size: 30px; letter-spacing: -0.01em; text-transform: none; line-height: 1.05; font-weight: 600; margin-bottom: 6px; }
.main-col { display: grid; gap: 28px; min-width: 0; }
.main-col h1 { font-size: clamp(28px, 3vw, 38px); line-height: 1.12; margin-top: 10px; }
.main-col .blurb { font-size: 17.5px; color: var(--muted); max-width: 58ch; }
.facts-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.facts-grid div { padding: 14px 16px; display: grid; gap: 2px; border-bottom: 1px solid var(--line); }
.facts-grid div:nth-child(odd) { border-right: 1px solid var(--line); }
.facts-grid div:nth-last-child(-n+2) { border-bottom: 0; }
.facts-grid b { font-weight: 600; font-size: 15.5px; }
.lists { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.lists ul { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 8px; }
.lists li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; font-size: 15px; }
.lists li svg { width: 16px; height: 16px; margin-top: 4px; color: var(--accent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 24px; display: grid; gap: 18px; }
.panel h2 { font-size: 20px; }
.field { display: grid; gap: 6px; }
.field > label, .field > .flabel { font-weight: 600; font-size: 14.5px; }
.field input[type="text"], .field input[type="email"] {
  border: 1px solid var(--line); background: var(--bg); border-radius: var(--r-sm); padding: 12px 14px; font-size: 16px;
  transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.field .err { color: var(--bad); font-size: 13.5px; }
.seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.seg label {
  display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; cursor: pointer;
  font-weight: 500; transition: border-color .2s var(--ease), background .2s var(--ease);
}
.seg label:hover { border-color: var(--fg); }
.seg input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.seg label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.form-error { color: var(--bad); font-size: 14px; }
.form-error:empty { display: none; }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--accent-ink) 40%, transparent); border-top-color: var(--accent-ink); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.onlist { display: grid; gap: 14px; }
.onlist .row2 { display: flex; align-items: center; gap: 12px; }
.onlist .tick { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); flex: none; }
.onlist .tick svg { width: 18px; height: 18px; }
.onlist .btns { display: flex; flex-wrap: wrap; gap: 10px; }

/* ---------- RSVP pass ---------- */
.passwrap { padding-block: 36px 72px; display: grid; gap: 26px; justify-items: start; }
.passwrap h1 { font-size: clamp(26px, 3vw, 34px); }
.pass {
  width: min(100%, 460px); background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; display: grid;
  animation: printIn .55s var(--ease) both;
}
@keyframes printIn { from { opacity: 0; transform: translateY(-14px); clip-path: inset(0 0 100% 0); } to { opacity: 1; transform: none; clip-path: inset(0 0 0 0); } }
.pass .p-top { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 14px; padding: 18px; align-items: center; }
.pass .p-top .thumb { width: 76px; height: 76px; border-radius: var(--r-sm); overflow: hidden; }
.pass .p-top .thumb svg { width: 100%; height: 100%; display: block; }
.pass h3 { font-size: 19px; line-height: 1.25; }
.pass .perf { position: relative; height: 18px; }
.pass .perf::before { content: ""; position: absolute; left: 18px; right: 18px; top: 50%; border-top: 2px dashed var(--line); }
.pass .perf::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 0 50%, var(--bg) 9px, transparent 9.5px), radial-gradient(circle at 100% 50%, var(--bg) 9px, transparent 9.5px); }
.pass .p-bottom { display: grid; grid-template-columns: minmax(0, 1fr) 118px; gap: 16px; padding: 8px 18px 18px; align-items: center; }
.pass dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 12px; font-size: 14px; }
.pass dt { color: var(--muted); }
.pass dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.qr { width: 118px; height: 118px; background: #ffffff; border-radius: var(--r-sm); padding: 6px; }
.qr svg { width: 100%; height: 100%; display: block; }
.code { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: .04em; }
.empty-card { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r-lg); padding: 32px; display: grid; gap: 12px; justify-items: start; max-width: 560px; }

/* ---------- guest list (owner only) ---------- */
.guests { padding-block: 32px 72px; display: grid; gap: 24px; }
.guests h1 { font-size: clamp(26px, 3vw, 34px); margin-top: 8px; }
.tally { display: flex; flex-wrap: wrap; gap: 12px; }
.tally div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 18px; display: grid; gap: 2px; min-width: 150px; }
.tally b { font-family: var(--font-display); font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; min-width: 620px; }
th { text-align: left; font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 12px 16px; border-bottom: 1px solid var(--line); }
td { padding: 12px 16px; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
tbody tr { transition: background .2s var(--ease); }
tbody tr:hover { background: var(--surface-2); }

/* ---------- footer ---------- */
.site-foot { border-top: 1px solid var(--line); }
.site-foot .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; padding-block: 28px calc(28px + env(safe-area-inset-bottom, 0px)); font-size: 14px; color: var(--muted); }
.site-foot a { text-decoration: none; transition: color .2s var(--ease); }
.site-foot a:hover { color: var(--fg); }

/* ---------- responsive ---------- */
@media (max-width: 960px) {
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .intro, .detail { grid-template-columns: minmax(0, 1fr); }
  .intro { gap: 32px; padding-block: 36px 32px; }
  .stub { transform: none; max-width: 540px; }
  .poster { position: relative; top: 0; aspect-ratio: 16 / 10; }
}
@media (max-width: 640px) {
  .site-head .wrap { gap: 10px; }
  .nav a { padding: 8px 7px; font-size: 14px; }
  .brand { gap: 8px; }
  .brand svg { width: 30px; height: 30px; }
  .brand b { font-size: 15px; }
  .brand span { display: none; }
  .cards { grid-template-columns: minmax(0, 1fr); }
  .lists, .facts-grid, .seg { grid-template-columns: minmax(0, 1fr); }
  .facts-grid div:nth-child(odd) { border-right: 0; }
  .facts-grid div:nth-last-child(2) { border-bottom: 1px solid var(--line); }
  .stub { grid-template-columns: 96px minmax(0, 1fr); }
  .pass .p-bottom { grid-template-columns: minmax(0, 1fr) 100px; }
  .qr { width: 100px; height: 100px; }
}
@media (max-width: 400px) {
  .nav a.hide-xs { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .stub { transform: none; }
}
</style>
</head>
<body>

<header class="site-head">
  <div class="wrap">
    <a class="brand" href="#" aria-label="London Social Club, home">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="19" fill="var(--accent)"/>
        <circle cx="20" cy="20" r="14.5" fill="none" stroke="var(--accent-ink)" stroke-width="1" opacity=".55"/>
        <text x="20" y="24.2" text-anchor="middle" font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="var(--accent-ink)" letter-spacing=".5">LSC</text>
      </svg>
      <div><b>London Social Club</b><span>London, Ontario</span></div>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#" data-nav="home" class="hide-xs">Events</a>
      <a href="#gala" data-nav="gala">Opening Gala</a>
      <a href="#my-rsvp" data-nav="my-rsvp">My RSVP<span class="dot" id="rsvp-dot" hidden></span></a>
    </nav>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<footer class="site-foot">
  <div class="wrap">
    <span>London Social Club · London, Ontario</span>
    <span><a href="#gala">Opening Gala</a> · <a href="#">Events</a> · <a href="#my-rsvp">My RSVP</a></span>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     Content
  ------------------------------------------------------------------ */

        '<div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn btn-ghost" href="#gala">Change RSVP</a><a class="btn btn-primary" href="#">See what is coming ' + ICON.arrow + '</a></div>' +
      '</div></section>';
  }

  /* ------------------------------------------------------------------
     Router
  ------------------------------------------------------------------ */
  var lastRoute = null;
  function route() {
    var h = (location.hash || "").replace(/^#/, "");
    var changed = h !== lastRoute;
    lastRoute = h;
    if (h !== "gala") editing = false;
    if (!h) renderHome();
    else if (h.indexOf("event-") === 0) renderEvent(h.slice(6));
    else if (h === "gala") renderGala();
    else if (h === "my-rsvp") renderMyRsvp();
    else renderHome();
    if (changed) window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
